{{define "keys-script"}}
<script>
(function () {
  'use strict';
  function localizeKeyLastRequests(scope) {
    // Parse explicit UTC instants, never the zone-less fallback display text.
    // Prepare everything first: unsupported Intl or invalid data retains UTC.
    let zone, changes;
    try {
      const formatter = new Intl.DateTimeFormat('en-CA', {
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit',
        hourCycle:'h23', numberingSystem:'latn'
      });
      zone = formatter.resolvedOptions().timeZone;
      if (!zone) return;
      changes = [];
      for (const node of scope.querySelectorAll('[data-key-last-time]')) {
        const iso = node.dataset.keyLastTime;
        if (!iso) continue;
        const date = new Date(iso);
        if (!Number.isFinite(date.getTime())) return;
        const parts = Object.fromEntries(formatter.formatToParts(date).map(function (part) { return [part.type, part.value]; }));
        changes.push({node:node, date:parts.year+'-'+parts.month+'-'+parts.day, clock:parts.hour+':'+parts.minute+':'+parts.second});
      }
    } catch (_) { return; }
    changes.forEach(function (change) {
      if (change.node.hasAttribute('data-key-full-time')) {
        change.node.textContent = change.date+' '+change.clock;
      } else {
        change.node.querySelector('[data-key-clock]').textContent = change.clock;
        change.node.querySelector('[data-key-date]').textContent = change.date;
      }
    });
    scope.querySelectorAll('[data-key-timezone]').forEach(function (label) {
      label.textContent = zone;
      label.title = '浏览器时区：'+zone;
    });
  }
  localizeKeyLastRequests(document);
  const form = document.getElementById('key-batch');
  const all = document.getElementById('select-keys');
  const items = form ? Array.from(form.querySelectorAll('input[name="ids"]')) : [];
  const selected = function () { return items.filter(function (item) { return item.checked; }); };
  const bar = document.getElementById('key-batchbar');
  const countLabel = document.getElementById('key-selection-count');
  const update = function () {
    const count = selected().length;
    if (all) { all.checked = items.length > 0 && count === items.length; all.indeterminate = count > 0 && count < items.length; }
    if (bar) bar.hidden = count === 0;
    if (countLabel) countLabel.textContent = '已选 ' + count + ' 把';
    items.forEach(function (item) { const row = item.closest('tr'); if (row) row.classList.toggle('key-selected', item.checked); });
  };
  if (all) all.addEventListener('change', function () { items.forEach(function (item) { item.checked = all.checked; }); update(); });
  items.forEach(function (item) { item.addEventListener('change', update); });
  const clear = document.getElementById('clear-key-selection');
  if (clear) clear.addEventListener('click', function () { items.forEach(function (item) { item.checked = false; }); update(); all.focus(); });
  if (form) form.addEventListener('submit', function (event) {
    if (!selected().length) { event.preventDefault(); if (countLabel) countLabel.textContent = '请先选择 Key'; }
  });
  update();

  const value = document.getElementById('created-keys');
  if (value) {
    const status = document.getElementById('key-export-status');
    document.getElementById('copy-keys').addEventListener('click', async function () {
      try { await navigator.clipboard.writeText(value.value); status.textContent = '已复制'; }
      catch (_) { value.focus(); value.select(); status.textContent = '请手动复制选中文本'; }
    });
    document.getElementById('download-keys').addEventListener('click', function () {
      const blob = new Blob([value.value + '\n'], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'gwpool-keys.txt'; link.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      status.textContent = '已导出纯文本';
    });
  }

  // Progressive enhancement: without dialog support the same sections/forms
  // remain in the document and ordinary detail links keep working.
  if (typeof HTMLDialogElement === 'undefined' || !HTMLDialogElement.prototype.showModal) return;
  const root = document.getElementById('keys-page');
  const dialogs = new Map();
  const detailTimeoutMS = 15000;
  let detailController = null;
  let detailVersion = 0;
  document.documentElement.classList.add('keys-enhanced');
  document.querySelectorAll('[data-key-dialog-control]').forEach(function (control) { control.hidden = false; });

  function mount(panel) {
    const dialog = document.createElement('dialog');
    dialog.className = 'key-dialog' + (panel.id === 'key-detail' ? ' key-drawer' : '');
    dialog.setAttribute('aria-labelledby', panel.getAttribute('aria-labelledby'));
    panel.hidden = false;
    dialog.append(panel);
    document.body.append(dialog);
    const state = {dialog:dialog, opener:null};
    dialogs.set(panel.id, state);
    dialog.addEventListener('click', function (event) {
      const close = event.target.closest('[data-key-close]');
      if (close) { event.preventDefault(); dialog.close(); return; }
      if (event.target === dialog) {
        const box = dialog.getBoundingClientRect();
        if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) dialog.close();
      }
    });
    dialog.addEventListener('close', function () {
      if (dialog.open) return;
      if (panel.id === 'key-detail') {
        detailVersion++;
        if (detailController) detailController.abort();
        // Direct detail URLs still close back to the original filtered list.
        if (new URL(location.href).searchParams.has('key')) history.replaceState(null, '', root.dataset.listUrl);
      }
      if (![...dialogs.values()].some(function (entry) { return entry.dialog.open; })) document.documentElement.classList.remove('key-dialog-open');
      if (state.opener && state.opener.isConnected) state.opener.focus({preventScroll:true});
    });
    return state;
  }

  function open(state, opener) {
    state.opener = opener || document.querySelector('.key-source-tabs [aria-current]') || document.querySelector('[data-key-open]');
    state.dialog.showModal();
    document.documentElement.classList.add('key-dialog-open');
  }

  document.querySelectorAll('[data-key-panel]').forEach(function (panel) { mount(panel); });
  function normalClick(event) { return event.button === 0 && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey; }
  document.querySelectorAll('[data-key-open]').forEach(function (trigger) {
    trigger.addEventListener('click', function (event) {
      const state = dialogs.get(trigger.dataset.keyOpen);
      if (!normalClick(event) || !state) return;
      event.preventDefault();
      open(state, trigger);
    });
  });
  const revoke = document.getElementById('open-key-revoke');
  if (revoke) revoke.addEventListener('click', function () {
    const chosen = selected();
    if (!chosen.length) return;
    const holder = document.getElementById('key-revoke-ids');
    holder.replaceChildren();
    chosen.forEach(function (item) {
      const input = document.createElement('input');
      input.type = 'hidden'; input.name = 'ids'; input.value = item.value; holder.append(input);
    });
    document.getElementById('key-revoke-count').textContent = String(chosen.length);
    open(dialogs.get('key-revoke'), revoke);
  });

  function loadingPanel() {
    const panel = document.createElement('section');
    panel.id = 'key-detail'; panel.className = 'key-panel';
    panel.setAttribute('aria-labelledby', 'key-detail-title');
    panel.innerHTML = '<header class="key-panel-heading"><div><span class="key-eyebrow">KEY 详情</span><h2 id="key-detail-title">正在读取…</h2></div><button type="button" class="key-close" data-key-close aria-label="关闭详情">×</button></header><div class="key-detail-loading" role="status">正在读取最新数据</div>';
    return panel;
  }

  document.querySelectorAll('[data-key-detail]').forEach(function (link) {
    link.addEventListener('click', async function (event) {
      if (!normalClick(event)) return;
      const target = new URL(link.href, location.href);
      if (target.origin !== location.origin || target.pathname !== '/admin/keys') return;
      event.preventDefault();
      if (detailController) detailController.abort();
      const controller = new AbortController();
      detailController = controller;
      const version = ++detailVersion;
      let state = dialogs.get('key-detail');
      if (!state) state = mount(loadingPanel());
      else state.dialog.replaceChildren(loadingPanel());
      if (!state.dialog.open) open(state, link);
      const timer = setTimeout(function () { controller.abort(); }, detailTimeoutMS);
      try {
        const response = await fetch(target.href, {credentials:'same-origin', cache:'no-store', signal:controller.signal});
        if (!response.ok) throw new Error(response.status === 401 ? '管理员登录已失效，请重新登录。' : '暂时无法读取详情，请稍后重试。');
        const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
        const panel = doc.getElementById('key-detail');
        if (!panel) throw new Error('详情响应不完整，请重新打开页面。');
        if (version !== detailVersion || !state.dialog.open) return;
        localizeKeyLastRequests(panel);
        state.dialog.replaceChildren(document.importNode(panel, true));
        state.dialog.querySelector('[data-key-close]').focus({preventScroll:true});
      } catch (error) {
        if (version !== detailVersion || !state.dialog.open) return;
        const content = state.dialog.querySelector('.key-detail-loading');
        state.dialog.querySelector('#key-detail-title').textContent = '未能读取详情';
        content.textContent = controller.signal.aborted ? '请求超时，请稍后重试。' : error.message;
        const fallback = document.createElement('a');
        fallback.href = target.href; fallback.textContent = '打开独立详情页'; fallback.style.display = 'block'; fallback.style.marginTop = '16px'; content.append(fallback);
      } finally { clearTimeout(timer); }
    });
  });
  const auto = document.querySelector('[data-key-auto]');
  if (auto) open(dialogs.get(auto.id));
})();
</script>
{{end}}
