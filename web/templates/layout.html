{{define "layout" -}}
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · gwpool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230969da'/%3E%3Ccircle cx='5.5' cy='5.5' r='1.8' fill='%23fff'/%3E%3Ccircle cx='10.5' cy='5.5' r='1.8' fill='%23fff'/%3E%3Ccircle cx='5.5' cy='10.5' r='1.8' fill='%23fff'/%3E%3Ccircle cx='10.5' cy='10.5' r='1.8' fill='%23fff' opacity='.45'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --card: #fff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --soft: #f6f8fa;
  --accent: #0969da; --primary: #0969da; --field: #818b98;
  --ok: #1a7f37; --ok-bg: #dafbe1; --bad: #cf222e; --bad-bg: #ffebe9; --warn: #9a6700; --warn-bg: #fff8c5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --card: #161b22; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --soft: #1c2129;
    --accent: #4493f8; --primary: #1f6feb; --field: #6e7681;
    --ok: #3fb950; --ok-bg: #12261e; --bad: #f85149; --bad-bg: #2d1517; --warn: #d29922; --warn-bg: #272115;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 14.5px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 68rem; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }

.top { background: var(--card); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: .75rem; min-height: 3.25rem; }
.brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; color: var(--fg); text-decoration: none; }
.pill { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--line);
        border-radius: 999px; padding: .1rem .65rem; cursor: help; }
main { padding-top: 1.75rem; padding-bottom: 2rem; }
footer { color: var(--muted); font-size: 12.5px; padding-bottom: 2.5rem; }

h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 .3rem; overflow-wrap: anywhere; }
h1 .badge { vertical-align: middle; margin-left: .4rem; }
h2 { font-size: 1.05rem; margin: 0 0 .75rem; }
h3 { font-size: .95rem; margin: 1.25rem 0 .4rem; }
.lead { color: var(--muted); margin: 0 0 1.25rem; }
.muted { color: var(--muted); }
.bad { color: var(--bad); font-weight: 600; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }
code { background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; margin-bottom: 1rem; }
.stat { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: .85rem 1rem; color: inherit; text-decoration: none; }
a.stat:hover { border-color: var(--accent); }
.stat b { display: block; font-size: 1.65rem; line-height: 1.3; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat b.mono { font-size: 1.1rem; line-height: 2.15rem; }
.stat span { color: var(--muted); font-size: 12.5px; }
.stat.ok b { color: var(--ok); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 1.1rem 1.25rem; margin-bottom: 1rem; scroll-margin-top: 1rem; }
.card > :first-child { margin-top: 0; }
.card > :last-child { margin-bottom: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .25rem 1rem; margin-bottom: .6rem; }
.card-head h2 { margin: 0; }
.card-head span { color: var(--muted); font-size: 12.5px; }
.note { background: var(--soft); border-radius: 8px; padding: .4rem 1rem; margin: 0 0 1rem; }
.note p { margin: .5rem 0; }
.foot { color: var(--muted); font-size: 12.5px; margin: .75rem 0 0; }

.badge { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.6; padding: 0 .6em;
         border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }

/* 表格放进自己的滚动框：窄屏不再把整页撑宽，长表在框里滚、表头吸顶。 */
.scroll { overflow: auto; max-height: 70vh; margin: 0 -.75rem; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: .45rem .75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; z-index: 1; background: var(--card); color: var(--muted);
     font-size: 12.5px; font-weight: 600; box-shadow: inset 0 -1px var(--line); border-bottom: 0; }
tbody tr:hover { background: var(--soft); }
tbody tr:last-child td { border-bottom: 0; }
td.text { white-space: normal; min-width: 10rem; overflow-wrap: anywhere; }
th.num, td.num { text-align: right; }

.copyrow { display: flex; gap: .5rem; align-items: stretch; margin: .5rem 0 .75rem; }
pre { margin: 0; background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
      padding: .55rem .75rem; overflow-x: auto; }
.copyrow pre { flex: 1; min-width: 0; user-select: all; }
pre.cmd { margin: .3rem 0 .75rem; }

form { display: grid; gap: .9rem; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
label { display: grid; gap: .35rem; font-size: 13px; font-weight: 600; }
label small { font-weight: 400; color: var(--muted); margin-left: .35rem; }
input, textarea { font: inherit; font-weight: 400; color: inherit; background: var(--card); width: 100%;
                  border: 1px solid var(--field); border-radius: 8px; padding: .5rem .65rem; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { min-height: 8rem; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
button { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--fg); background: var(--soft);
         border: 1px solid var(--line); border-radius: 8px; padding: .45rem 1rem; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
button.primary:hover { filter: brightness(1.12); }
button.danger { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-bg); }
button.danger:hover { border-color: var(--bad); }
button:disabled { opacity: .65; cursor: progress; }
.err { margin: 0; padding: .55rem .8rem; border-radius: 8px; background: var(--bad-bg); color: var(--bad); white-space: pre-wrap; }

@media (max-width: 640px) {
  .fields { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .card { padding: 1rem; }
  /* 手机上不套第二层竖向滚动，让整页滚。 */
  .scroll { max-height: none; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">gwpool</a>
  {{if eq .Mode "pool"}}<span class="pill" title="扫描账号保温，消费账号取用">多账号模式</span>
  {{- else}}<span class="pill" title="按需现铸、用完即弃，不保温">单账号模式</span>{{end}}
</div></header>
<main class="wrap">{{template "content" .}}</main>
<footer class="wrap">
网关池。只收集和下发路由 cookie（<code>__cflb</code> / <code>__oailb</code>），怎么用是使用者的事。
</footer>
<script>
(function () {
  // 只有开了 JS 才有用的控件（复制、选文件）默认 hidden，这里放出来。
  for (const el of document.querySelectorAll('[data-js]')) el.hidden = false;

  // 后端按字符串排网关名，unified-71 会排到 unified-202 后面；这里按数字重排。
  const byNum = new Intl.Collator('en', { numeric: true }).compare;
  for (const tb of document.querySelectorAll('tbody[data-natsort]')) {
    const rows = Array.from(tb.rows);
    rows.sort(function (a, b) {
      return byNum(a.cells[0].textContent, b.cells[0].textContent) ||
             byNum(a.cells[1].textContent, b.cells[1].textContent);
    });
    tb.append.apply(tb, rows);
  }

  for (const el of document.querySelectorAll('.origin')) el.textContent = location.origin;
  const pageURL = document.getElementById('page-url');
  if (pageURL) pageURL.textContent = location.href;

  for (const b of document.querySelectorAll('button[data-copy]')) {
    b.addEventListener('click', async function () {
      const src = document.querySelector(b.dataset.copy);
      let ok = false;
      try {
        await navigator.clipboard.writeText(src.textContent.trim());
        ok = true;
      } catch (e) {
        // 局域网 IP 走 HTTP 时浏览器不给 clipboard API：选中后走老接口。
        getSelection().selectAllChildren(src);
        ok = document.execCommand('copy');
      }
      if (!b.dataset.label) b.dataset.label = b.textContent;
      b.textContent = ok ? '已复制' : '已选中，按 Ctrl+C';
      setTimeout(function () { b.textContent = b.dataset.label; }, 1600);
    });
  }

  const form = document.getElementById('upload');
  if (!form) return;
  const btn = form.querySelector('button[type=submit]');
  const err = document.getElementById('upload-err');
  const file = document.getElementById('creds-file');
  document.getElementById('pick').addEventListener('click', function () { file.click(); });
  file.addEventListener('change', async function () {
    const f = file.files[0];
    file.value = '';
    if (!f) return;
    if (f.size > 65536) {
      err.textContent = '这个文件有 ' + Math.round(f.size / 1024) + ' KB，不像 codex 的 auth.json（一般只有几 KB）。';
      err.hidden = false;
      return;
    }
    form.elements.creds.value = (await f.text()).trim();
    err.hidden = true;
  });
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    // 双击会建出两个重复账号、排两次首扫：提交中一律不理。
    if (btn.disabled) return;
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = '提交中…';
    err.hidden = true;
    try {
      const r = await fetch(form.action, { method: 'POST', headers: { Accept: 'application/json' },
                                          body: new URLSearchParams(new FormData(form)) });
      if (r.ok) {
        const url = (await r.json()).url;
        form.reset();
        location.assign(url);
        return;
      }
      err.textContent = (await r.text()).trim() || ('HTTP ' + r.status);
    } catch (e2) {
      // 断连、超大请求体被服务端提前掐断、回了 200 却不是 JSON，都到这里：账号可能已经建好了。
      err.textContent = '提交结果不明：可能没发出去，也可能已经建好了。再点一次可能会多建一个账号——拿不准就找运营方。';
    }
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = label;
  });
})();
</script>
</body>
</html>
{{- end}}
